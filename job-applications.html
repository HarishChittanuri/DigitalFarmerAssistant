<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Applications - Digital Farmer Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/farmer-dashboard.css">
</head>
<body class="bg-green-50 min-h-screen">
  <nav class="dashboard-nav">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="nav-icon">📋</span>
        <span class="nav-title">Job Applications</span>
      </div>
      <div class="nav-actions">
        <a href="farmer-dashboard.html" class="back-btn">← Back to Dashboard</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <section class="quick-actions">
      <div class="actions-container">
        <div class="section-header">
          <h1 class="section-title">Job Applications</h1>
          <p class="section-description">Review applications from laborers for your jobs</p>
        </div>
        
        <div id="applications-list" class="applications-list grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
          <!-- Example Card (will be dynamically generated by JS) -->
          <div class="job-card bg-white rounded-lg shadow-md p-6 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-2">
                <h3 class="job-title text-lg font-semibold text-green-700">Wheat Harvesting</h3>
                <span class="application-status accepted px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold">ACCEPTED</span>
              </div>
              <p class="text-gray-600 mb-1"><strong>Applicant:</strong> John Doe</p>
              <p class="text-gray-600 mb-1"><strong>Contact:</strong> 9876543210</p>
              <p class="text-gray-600 mb-1"><strong>Location:</strong> Village A</p>
              <p class="text-gray-600 mb-1"><strong>Wages:</strong> ₹500/day</p>
              <p class="text-gray-600 mb-1"><strong>Applied On:</strong> 2025-10-10</p>
              <p class="text-gray-600 mb-1"><strong>Note:</strong> Ready to start ASAP</p>
            </div>
            <div class="flex gap-2 mt-4">
              <button class="accept-btn bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Accept</button>
              <button class="reject-btn bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Reject</button>
            </div>
          </div>
          <!-- End Example Card -->
          <!-- More cards will be inserted here by JS -->
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./js/farmerDashboard.js"></script>
</body>
</html>
