<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post a Job - Digital Farmer Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Reusing the Farmer Dashboard Palette */
      --bg-color: #f0f2ef;
      --primary-color: #166534;
      --secondary-color: #5a677d;
      --accent-color: #f59e0b;
      --shadow-dark: #d1d9e6;
      --shadow-light: #ffffff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--secondary-color);
      background-color: var(--bg-color);
      /* Background Image with new light effect */
      background-image: 
        /* Top light effect - Enhanced */
        radial-gradient(ellipse at top, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%),
        /* Base overlay - Reduced opacity */
        linear-gradient(rgba(240, 242, 239, 0.8), rgba(240, 242, 239, 0.8)), 
        /* The actual image */
        url('https://images.pexels.com/photos/158827/field-corn-air-frisch-158827.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Base Neumorphism Styles */
    .neu-card {
      background-color: var(--bg-color);
      border-radius: 20px;
      box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light);
    }
    
    .neu-button {
      background-color: var(--bg-color);
      border-radius: 12px;
      border: none;
      color: var(--primary-color);
      font-weight: 600;
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      transition: all 0.2s ease-in-out;
      text-decoration: none; /* For anchor tags styled as buttons */
      display: inline-block; /* For anchor tags */
      text-align: center; /* For anchor tags */
    }

    .neu-button:hover {
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    }

    .neu-button:active {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    }
    
    .neu-button.primary {
        color: white;
        background-color: var(--primary-color);
        box-shadow: 5px 5px 10px #115e2f99, -5px -5px 10px #1b7a3d99;
    }
    .neu-button.primary:hover {
        background-color: #1a7a3d;
    }

    .neu-input {
      background-color: var(--bg-color);
      border-radius: 12px;
      border: none;
      width: 100%;
      box-shadow: inset 5px 5px 8px var(--shadow-dark), inset -5px -5px 8px var(--shadow-light);
      color: var(--secondary-color);
      transition: all 0.2s ease-in-out;
    }

    .neu-input:focus {
      outline: none;
      box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
    }
    
    .dashboard-nav {
      background-color: var(--bg-color);
      box-shadow: 7px 7px 14px var(--shadow-dark);
      padding: 1rem 2rem;
    }
    
    .form-label {
        font-weight: 500;
        margin-bottom: 0.5rem;
        display: block;
    }

  </style>
</head>
<body class="min-h-screen">

  <!-- Navigation Header -->
  <nav class="dashboard-nav sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">📝</span>
        <span class="text-xl font-bold" style="color: var(--primary-color);">Post a New Job</span>
      </div>
      <div class="flex items-center space-x-4">
        <a href="farmer-dashboard.html" class="neu-button px-4 py-2 text-sm">← Back to Dashboard</a>
        <button id="logoutBtn" class="neu-button px-4 py-2 text-sm">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto p-4 md:p-8">
    <section class="neu-card p-6 md:p-8">
      <div class="text-center mb-8">
        <h1 class="text-2xl md:text-3xl font-bold" style="color: var(--primary-color);">Create New Job Listing</h1>
        <p class="mt-2 text-md">Fill out the form below to post a new job for agricultural laborers</p>
      </div>
      
      <!-- Job Posting Form -->
      <form id="post-job-form" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          
          <div class="md:col-span-2">
            <label for="job-title" class="form-label">Job Title *</label>
            <input id="job-title" required placeholder="e.g., Wheat Harvesting, Rice Planting" class="neu-input p-3">
          </div>
          
          <div>
            <label for="job-wages" class="form-label">Daily Wages (₹) *</label>
            <input id="job-wages" required type="number" placeholder="e.g., 500" class="neu-input p-3">
          </div>
          
          <div>
            <label for="job-location" class="form-label">Farm Location *</label>
            <input id="job-location" required placeholder="e.g., Village, District" class="neu-input p-3">
          </div>
          
          <div>
            <label for="job-start" class="form-label">Start Date</label>
            <input id="job-start" type="date" class="neu-input p-3">
          </div>
          
          <div>
            <label for="job-duration" class="form-label">Duration (days)</label>
            <input id="job-duration" type="number" placeholder="e.g., 7" class="neu-input p-3">
          </div>
          
          <div class="md:col-span-2">
            <label for="job-skills" class="form-label">Required Skills</label>
            <input id="job-skills" placeholder="e.g., Plowing, Harvesting, Irrigation (comma separated)" class="neu-input p-3">
          </div>
          
          <div class="md:col-span-2">
            <label for="job-desc" class="form-label">Job Description</label>
            <textarea id="job-desc" placeholder="Describe the job details, requirements, and any special instructions..." rows="4" class="neu-input p-3"></textarea>
          </div>
        </div>
        
        <div class="flex items-center justify-end space-x-4 pt-4">
          <a href="farmer-dashboard.html" class="neu-button px-6 py-3">Cancel</a>
          <button type="submit" class="neu-button primary px-6 py-3">Post Job</button>
        </div>
      </form>
      
      <p id="post-job-msg" class="text-center mt-4 hidden"></p>
    </section>
  </main>

  <script type="module" src="./js/farmerDashboard.js"></script>
  
</body>
</html>
