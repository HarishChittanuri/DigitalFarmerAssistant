<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Digital Farmer Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #e0e5ec;
      --primary-color: #166534; /* Dark Green */
      --secondary-color: #5a677d; /* Softer Gray */
    }

    body {
      font-family: 'Poppins', sans-serif;
      /* --- BACKGROUND IMAGE OPACITY INCREASED --- */
      background-image: linear-gradient(rgba(224, 229, 236, 0.65), rgba(224, 229, 236, 0.65)),
                        url('https://images.pexels.com/photos/2131784/pexels-photo-2131784.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .neumorphism-card {
      background-color: var(--bg-color);
      border-radius: 20px;
      /* --- CARD SHADOW (STROKE) REDUCED --- */
      box-shadow: 7px 7px 14px rgba(163, 177, 198, 0.6),
                  -7px -7px 14px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .neumorphism-input {
      background-color: var(--bg-color);
      border-radius: 12px;
      border: none;
      /* --- INPUT SHADOW REFINED --- */
      box-shadow: inset 5px 5px 8px 0 rgba(163, 177, 198, 0.6),
                  inset -5px -5px 8px 0 rgba(255, 255, 255, 0.5);
      color: var(--secondary-color);
      transition: all 0.2s ease-in-out;
    }

    .neumorphism-input:focus {
      outline: none;
      box-shadow: inset 2px 2px 4px 0 rgba(163, 177, 198, 0.6),
                  inset -2px -2px 4px 0 rgba(255, 255, 255, 0.5);
    }
    
    .neumorphism-input::placeholder {
        color: #a3b1c6;
    }

    .neumorphism-button {
      background-color: var(--bg-color);
      border-radius: 12px;
      border: none;
      color: var(--primary-color);
      font-weight: 600;
      /* --- BUTTON SHADOW REFINED --- */
      box-shadow: 5px 5px 10px rgba(163, 177, 198, 0.6),
                  -5px -5px 10px rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease-in-out;
    }

    .neumorphism-button:hover {
      box-shadow: 3px 3px 6px rgba(163, 177, 198, 0.6),
                  -3px -3px 6px rgba(255, 255, 255, 0.5);
    }

    .neumorphism-button:active {
      box-shadow: inset 3px 3px 6px 0 rgba(163, 177, 198, 0.6),
                  inset -3px -3px 6px 0 rgba(255, 255, 255, 0.5);
    }

    .link-style {
        color: var(--primary-color);
        font-weight: 600;
    }
    .link-style:hover {
        text-decoration: underline;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">

  <div class="neumorphism-card p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center mb-2" style="color: var(--primary-color);">
       Digital Farmer Assistant
    </h2>
    <h3 class="text-lg font-semibold text-center mb-6" style="color: var(--secondary-color);">
      Welcome Back
    </h3>

    <form id="loginForm" class="space-y-6">
      <input type="text" id="loginUsername" placeholder="Username" required class="w-full py-3 px-4 neumorphism-input" />
      <input type="password" id="loginPassword" placeholder="Password" required class="w-full py-3 px-4 neumorphism-input" />
      <button type="submit" id="loginBtn" class="w-full py-3 neumorphism-button">
        Login
      </button>
    </form>

    <p class="text-center mt-6 text-sm" style="color: var(--secondary-color);">
      New to the platform?
      <a href="signup.html" class="link-style">Sign up</a>
    </p>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
