<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Digital Farmer Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #e0e5ec;
      --primary-color: #166534; /* Dark Green */
      --secondary-color: #5a677d; /* Softer Gray */
    }

    body {
      font-family: 'Poppins', sans-serif;
      /* --- BACKGROUND IMAGE OPACITY INCREASED --- */
      background-image: linear-gradient(rgba(224, 229, 236, 0.65), rgba(224, 229, 236, 0.65)),
                        url('https://images.pexels.com/photos/2131784/pexels-photo-2131784.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .neumorphism-card {
      background-color: var(--bg-color);
      border-radius: 20px;
      /* --- CARD SHADOW (STROKE) REDUCED --- */
      box-shadow: 7px 7px 14px rgba(163, 177, 198, 0.6),
                  -7px -7px 14px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .neumorphism-input {
      background-color: var(--bg-color);
      border-radius: 12px;
      border: none;
      /* --- INPUT SHADOW REFINED --- */
      box-shadow: inset 5px 5px 8px 0 rgba(163, 177, 198, 0.6),
                  inset -5px -5px 8px 0 rgba(255, 255, 255, 0.5);
      color: var(--secondary-color);
      transition: all 0.2s ease-in-out;
      appearance: none; /* Removes default select arrow */
    }
    
    .neumorphism-input:focus {
      outline: none;
      box-shadow: inset 2px 2px 4px 0 rgba(163, 177, 198, 0.6),
                  inset -2px -2px 4px 0 rgba(255, 255, 255, 0.5);
    }
    
    .neumorphism-input::placeholder {
        color: #a3b1c6;
    }
    
    .select-wrapper {
        position: relative;
    }

    .select-wrapper::after {
        content: '▼';
        font-size: 0.8rem;
        color: var(--secondary-color);
        position: absolute;
        right: 1.25rem;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
    }

    .neumorphism-button {
      background-color: var(--bg-color);
      border-radius: 12px;
      border: none;
      color: var(--primary-color);
      font-weight: 600;
      /* --- BUTTON SHADOW REFINED --- */
      box-shadow: 5px 5px 10px rgba(163, 177, 198, 0.6),
                  -5px -5px 10px rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease-in-out;
    }

    .neumorphism-button:hover {
      box-shadow: 3px 3px 6px rgba(163, 177, 198, 0.6),
                  -3px -3px 6px rgba(255, 255, 255, 0.5);
    }

    .neumorphism-button:active {
      box-shadow: inset 3px 3px 6px 0 rgba(163, 177, 198, 0.6),
                  inset -3px -3px 6px 0 rgba(255, 255, 255, 0.5);
    }

    .link-style {
        color: var(--primary-color);
        font-weight: 600;
    }
    .link-style:hover {
        text-decoration: underline;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen py-8">

  <div class="neumorphism-card p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-2" style="color: var(--primary-color);">
       Digital Farmer Assistant
    </h2>
    <h3 class="text-lg font-semibold text-center mb-6" style="color: var(--secondary-color);">
      Create an Account
    </h3>

    <form id="signupForm" class="space-y-6">
      <input type="text" id="signupUsername" placeholder="Username" required class="w-full py-3 px-4 neumorphism-input">
      <input type="password" id="signupPassword" placeholder="Password" required class="w-full py-3 px-4 neumorphism-input">

      <div class="select-wrapper">
        <select id="signupType" required class="w-full py-3 px-4 neumorphism-input">
          <option value="" disabled selected>Select Your Role</option>
          <option value="farmer">Farmer</option>
          <option value="labor">Labor</option>
        </select>
      </div>

      <!-- Labor Profile Fields (Hidden by default) -->
      <div id="laborFields" class="space-y-4 hidden pt-2">
        <div>
          <label for="signupSkills" class="block text-sm font-medium mb-2 pl-1" style="color: var(--secondary-color);">Your Skills</label>
          <input type="text" id="signupSkills" placeholder="e.g., Plowing, Harvesting, Irrigation" class="w-full py-3 px-4 neumorphism-input text-sm">
          <p class="text-xs text-gray-400 mt-1 pl-1">Separate skills with commas</p>
        </div>
        
        <div>
          <label for="signupLocations" class="block text-sm font-medium mb-2 pl-1" style="color: var(--secondary-color);">Preferred Locations</label>
          <input type="text" id="signupLocations" placeholder="e.g., Pune, Nashik, Nagpur" class="w-full py-3 px-4 neumorphism-input text-sm">
          <p class="text-xs text-gray-400 mt-1 pl-1">Separate locations with commas</p>
        </div>
        
        <div>
          <label for="signupExperience" class="block text-sm font-medium mb-2 pl-1" style="color: var(--secondary-color);">Experience Level</label>
          <div class="select-wrapper">
            <select id="signupExperience" class="w-full py-3 px-4 neumorphism-input text-sm">
              <option value="beginner">Beginner (0-1 years)</option>
              <option value="intermediate">Intermediate (1-3 years)</option>
              <option value="experienced">Experienced (3+ years)</option>
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="w-full py-3 neumorphism-button !mt-8">Sign Up</button>
    </form>

    <p class="text-center mt-6 text-sm" style="color: var(--secondary-color);">
      Already have an account? 
      <a href="login.html" class="link-style">Login</a>
    </p>
  </div>

  <script>
    // Show/hide labor fields based on role selection
    document.getElementById('signupType').addEventListener('change', function() {
      const laborFields = document.getElementById('laborFields');
      if (this.value === 'labor') {
        laborFields.classList.remove('hidden');
      } else {
        laborFields.classList.add('hidden');
      }
    });
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
